<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Color Protection - Live Result</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #111;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

h1 {
  margin: 20px 0 8px;
}

#timer {
  font-size: 30px;
  font-weight: bold;
  color: #00eaff;
  margin: 10px;
}

.game {
  width: 92%;
  max-width: 600px;
  margin: auto;
  border: 4px solid white;
  border-radius: 12px;
  padding: 20px;
  min-height: 600px;
}

.box {
  background: #222;
  border-radius: 12px;
  padding: 20px;
  margin: 15px 0;
}

.number {
  font-size: 65px;
  font-weight: bold;
  margin: 10px;
}

.color {
  font-size: 28px;
  font-weight: bold;
}

.next {
  color: #ffd000;
  font-size: 22px;
}

button {
  background: #00bfff;
  color: white;
  border: 0;
  border-radius: 10px;
  padding: 16px 30px;
  font-size: 20px;
  margin-top: 15px;
}

button:active {
  transform: scale(.96);
}

.history {
  text-align: left;
  max-height: 180px;
  overflow: auto;
}

.history div {
  background: #333;
  padding: 8px;
  margin: 5px;
  border-radius: 6px;
}
</style>
</head>

<body>

<h1>🎮 COLOR PROTECTION</h1>

<div id="timer">10</div>

<div class="game">

  <div class="box">
    <div>বর্তমান ফলাফল</div>
    <div id="currentNumber" class="number">-</div>
    <div id="currentColor" class="color">অপেক্ষা করুন...</div>
  </div>

  <div class="box">
    <div class="next">🔮 NEXT RESULT</div>

    <div id="nextNumber" class="number">?</div>
    <div id="nextColor" class="color">?</div>
  </div>

  <button onclick="startGame()">START GAME</button>

  <div class="box">
    <h3>📜 Result History</h3>
    <div id="history" class="history"></div>
  </div>

</div>

<script>

let time = 10;
let timer;
let nextNumber;
let nextColor;

const colors = [
  "RED 🔴",
  "GREEN 🟢",
  "VIOLET 🟣"
];

function createResult() {

  nextNumber = Math.floor(Math.random() * 10);

  nextColor = colors[
    Math.floor(Math.random() * colors.length)
  ];

  document.getElementById("nextNumber").innerText =
    nextNumber;

  document.getElementById("nextColor").innerText =
    nextColor;
}

function showResult() {

  document.getElementById("currentNumber").innerText =
    nextNumber;

  document.getElementById("currentColor").innerText =
    nextColor;

  addHistory(nextNumber, nextColor);

  createResult();

  time = 10;
}

function addHistory(number, color) {

  const history =
    document.getElementById("history");

  const item =
    document.createElement("div");

  item.innerText =
    "Number: " + number +
    "  |  Color: " + color;

  history.prepend(item);
}

function startGame() {

  clearInterval(timer);

  createResult();

  time = 10;

  document.getElementById("timer").innerText =
    time;

  timer = setInterval(() => {

    time--;

    document.getElementById("timer").innerText =
      time;

    if (time <= 0) {
      showResult();
    }

  }, 1000);
}

createResult();

</script>

</body>
</html>
