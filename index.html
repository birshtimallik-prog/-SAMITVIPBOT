<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WinGo 1 Min Demo</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#111b45;
  color:white;
  font-family:Arial,sans-serif;
  text-align:center;
}

.app{
  max-width:500px;
  margin:auto;
  padding:15px;
}

h1{
  margin:8px 0 15px;
  font-size:28px;
}

.timer-box{
  background:#1687d9;
  border-radius:15px;
  padding:15px;
}

.timer{
  font-size:50px;
  font-weight:bold;
  letter-spacing:5px;
}

.period{
  font-size:17px;
  margin-top:8px;
}

.buttons{
  display:flex;
  gap:8px;
  margin-top:15px;
}

.buttons div{
  flex:1;
  padding:15px 5px;
  border-radius:10px;
  font-weight:bold;
}

.green{background:#16a34a}
.violet{background:#8b42d6}
.red{background:#ef3340}

.numbers{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:10px;
  margin-top:18px;
}

.num{
  padding:18px 5px;
  border-radius:50%;
  font-size:25px;
  font-weight:bold;
}

.n0,.n2,.n4,.n6,.n8{background:#e83b4b}
.n1,.n3,.n5,.n7,.n9{background:#18a878}

.result{
  margin-top:20px;
  background:#222;
  border-radius:15px;
  padding:20px;
}

.result-title{
  color:#aaa;
}

.result-value{
  font-size:32px;
  font-weight:bold;
  margin-top:10px;
}

.warning{
  color:#aaa;
  font-size:12px;
  margin-top:15px;
}
</style>
</head>

<body>

<div class="app">

<h1>🎨 WinGo 1 Min — Demo</h1>

<div class="timer-box">

<div id="timer" class="timer">00:60</div>

<div class="period">
Period: <span id="period">---</span>
</div>

</div>

<div class="buttons">
<div class="green">Green</div>
<div class="violet">Violet</div>
<div class="red">Red</div>
</div>

<div class="numbers">

<div class="num n0">0</div>
<div class="num n1">1</div>
<div class="num n2">2</div>
<div class="num n3">3</div>
<div class="num n4">4</div>

<div class="num n5">5</div>
<div class="num n6">6</div>
<div class="num n7">7</div>
<div class="num n8">8</div>
<div class="num n9">9</div>

</div>

<div class="result">

<div class="result-title">
ডেমো রেজাল্ট
</div>

<div id="result" class="result-value">
অপেক্ষা করুন...
</div>

</div>

<div class="warning">
এটি শুধুমাত্র সিমুলেশন। কোনো আসল Tiranga ফলাফল আগে থেকে জানায় না।
</div>

</div>

<script>

function pad(n){
  return String(n).padStart(2,"0");
}


/* Period তৈরি */
function getPeriod(){

  const now = new Date();

  const date =
    now.getFullYear().toString() +
    pad(now.getMonth()+1) +
    pad(now.getDate());

  const minutes =
    now.getHours()*60 +
    now.getMinutes();

  return date + "1000" + String(minutes).padStart(4,"0");
}


/* ডেমো ফলাফল */
function makeDemoResult(){

  const number =
    Math.floor(Math.random()*10);

  let color;

  if(number === 0 || number === 5){
    color = "Violet";
  }
  else if(number % 2 === 0){
    color = "Red";
  }
  else{
    color = "Green";
  }

  const size =
    number >= 5 ? "Big" : "Small";

  return color + " • " + number + " • " + size;
}


/* প্রতি সেকেন্ডে ঘড়ি আপডেট */
function update(){

  const now = new Date();

  const seconds =
    now.getSeconds();

  const remaining =
    60 - seconds;

  document.getElementById("timer")
    .textContent =
    "00:" + pad(remaining);

  document.getElementById("period")
    .textContent =
    getPeriod();


  /* নতুন মিনিট শুরু */
  if(seconds === 0){

    document.getElementById("result")
      .textContent =
      makeDemoResult();

  }

}


update();

setInterval(update,1000);

</script>

</body>
</html>
