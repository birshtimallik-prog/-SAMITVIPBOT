<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Color Protection Demo</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #111;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

h1 {
  margin: 20px 0 8px;
}

#game {
  width: 92%;
  max-width: 600px;
  height: 70vh;
  margin: auto;
  border: 4px solid white;
  background: #222;
  position: relative;
  overflow: hidden;
}

.ball {
  position: absolute;
  width: 70px;
  height: 70px;
  border-radius: 50%;
}

.green {
  background: #00ff55;
  box-shadow: 0 0 25px #00ff55;
}

.red {
  background: red;
  box-shadow: 0 0 20px red;
}

#result {
  font-size: 30px;
  font-weight: bold;
  margin: 15px;
}

button {
  border: none;
  border-radius: 12px;
  padding: 16px 35px;
  font-size: 22px;
  background: #08bff0;
  color: white;
}

button:active {
  transform: scale(.96);
}
</style>
</head>

<body>

<h1>🎨 Color Protection</h1>

<div id="result">START চাপুন</div>

<div id="game">
  <div id="player" class="ball green"></div>
</div>

<button onclick="startGame()">START GAME</button>

<script>
const game = document.getElementById("game");
const result = document.getElementById("result");
const player = document.getElementById("player");

function randomNumber() {
  return Math.floor(Math.random() * 10) + 1;
}

function startGame() {

  result.textContent = "Result তৈরি হচ্ছে...";

  document.querySelectorAll(".enemy").forEach(e => e.remove());

  // নিজের ডেমো গেমের র‍্যান্ডম রেজাল্ট
  const number = randomNumber();
  const color = Math.random() < 0.5 ? "RED" : "GREEN";

  // লাল বল তৈরি
  for (let i = 0; i < 5; i++) {

    const enemy = document.createElement("div");

    enemy.className = "ball red enemy";

    enemy.style.left =
      Math.random() * (game.clientWidth - 70) + "px";

    enemy.style.top =
      Math.random() * (game.clientHeight - 70) + "px";

    game.appendChild(enemy);
  }

  setTimeout(() => {
    result.innerHTML =
      "🎯 Result: <b>" + color + "</b> &nbsp; | &nbsp; Number: <b>" + number + "</b>";

  }, 700);
}
</script>

</body>
</html>
