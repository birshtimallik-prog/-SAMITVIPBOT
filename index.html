<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Color Protection Live Demo</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#111;
  color:white;
  font-family:Arial,sans-serif;
  text-align:center;
}

h1{
  margin:18px 0 8px;
  font-size:30px;
}

.badge{
  display:inline-block;
  background:#222;
  padding:8px 15px;
  border-radius:20px;
  color:#00eaff;
}

#game{
  width:92%;
  max-width:520px;
  height:520px;
  margin:18px auto;
  border:4px solid white;
  position:relative;
  overflow:hidden;
  background:#191919;
}

.ball{
  width:65px;
  height:65px;
  border-radius:50%;
  position:absolute;
  box-shadow:0 0 25px currentColor;
}

#timer{
  font-size:38px;
  font-weight:bold;
  margin:10px;
  color:#00eaff;
}

#period{
  font-size:18px;
  margin:8px;
}

#prediction{
  margin:15px auto;
  width:90%;
  max-width:400px;
  background:#222;
  border-radius:15px;
  padding:18px;
  font-size:23px;
}

.result{
  font-size:30px;
  font-weight:bold;
  margin-top:10px;
}

button{
  border:0;
  border-radius:12px;
  padding:15px 30px;
  font-size:20px;
  background:#00bfff;
  color:white;
}

.green{color:#00ff66}
.red{color:#ff3030}
.violet{color:#c060ff}
</style>
</head>

<body>

<h1>🎨 Color Protection</h1>
<div class="badge">LIVE DEMO</div>

<div id="timer">60</div>
<div id="period">Period: --</div>

<div id="game"></div>

<div id="prediction">
  পরবর্তী ডেমো ফল
  <div id="predictionText" class="result">
    অপেক্ষা করুন...
  </div>
</div>

<button onclick="startGame()">START GAME</button>

<script>

let running=false;
let seconds=60;
let period=1;
let timer=null;

const colors=[
  {name:"GREEN", class:"green"},
  {name:"RED", class:"red"},
  {name:"VIOLET", class:"violet"}
];

function makeResult(){

  const color =
    colors[Math.floor(Math.random()*colors.length)];

  const number =
    Math.floor(Math.random()*10);

  let size = number <= 4 ? "SMALL" : "BIG";

  return {
    color:color,
    number:number,
    size:size
  };
}

function showResult(){

  const r=makeResult();

  document.getElementById("predictionText").innerHTML =
    `<span class="${r.color.class}">
      ${r.color.name} • ${r.number} • ${r.size}
    </span>`;

  createBalls();
}

function createBalls(){

  const game=document.getElementById("game");
  game.innerHTML="";

  for(let i=0;i<5;i++){

    const r=makeResult();

    const ball=document.createElement("div");

    ball.className="ball";

    ball.style.background =
      r.color.name.toLowerCase();

    ball.style.color =
      r.color.name.toLowerCase();

    ball.style.left =
      Math.random()*80 + "%";

    ball.style.top =
      Math.random()*85 + "%";

    game.appendChild(ball);
  }
}

function startGame(){

  if(running)return;

  running=true;
  seconds=60;

  showResult();

  timer=setInterval(()=>{

    seconds--;

    document.getElementById("timer").textContent =
      seconds;

    document.getElementById("period").textContent =
      "Period: " + period;

    if(seconds<=0){

      seconds=60;
      period++;

      showResult();
    }

  },1000);
}

</script>

</body>
</html>
