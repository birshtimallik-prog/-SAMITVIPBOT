<script>
let currentPeriod = 20260818100011189;

// ছবিতে যখন 23 সেকেন্ড বাকি ছিল
let seconds = 23;

function showPeriod() {
    document.getElementById("period").innerText =
        "Period: " + currentPeriod;
}

function updateTimer() {

    document.getElementById("timer").innerText =
        "00:" + String(seconds).padStart(2, "0");

    if (seconds === 0) {
        currentPeriod++;
        seconds = 59;
        showPeriod();
    } else {
        seconds--;
    }
}

showPeriod();
updateTimer();

setInterval(updateTimer, 1000);
</script>
